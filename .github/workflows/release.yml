name: Release

# A tag push builds and publishes the release. A pull request that touches the release path
# runs the same build jobs as a dry run: nothing is published, release is skipped and verify
# runs only its toolchain check.
on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [main, rebuild]
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - scripts/**
      - Cargo.toml
      - Cargo.lock
      - README.md
      - CHANGELOG.md
      - LICENSE
      - renovate.json

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Toolchain of the test, binary, deb and rpm jobs (the arch jobs build with the Rust of the
  # Arch container); verify fails unless ci.yml pins the same.
  RUSTUP_TOOLCHAIN: '1.99.1'

jobs:
  # The version without "v": from the tag, on a pull request from Cargo.toml.
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ver=${GITHUB_REF_NAME#v}
          else
            ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          fi
          test -n "$ver"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

  # Fails at once unless the tagged commit is on main, Cargo.toml, PKGBUILD and CHANGELOG.md
  # match the tag and ci.yml tests with the same toolchain. On a pull request only the
  # toolchain check runs. The job itself must not be skipped: GitHub then skips every job
  # that depends on it, directly or not.
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main
      - if: startsWith(github.ref, 'refs/tags/')
        run: scripts/changelog-section.sh "$GITHUB_REF_NAME" > /dev/null
      - run: |
          grep -qx "  RUSTUP_TOOLCHAIN: '$RUSTUP_TOOLCHAIN'" .github/workflows/ci.yml

  # The fmt, clippy, test and msrv steps of ci.yml.
  test:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          --component rustfmt --component clippy --no-self-update
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          cargo "+$msrv" test --locked

  # One job per package format and architecture: a failure reruns only that job.
  binary:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - run: cargo build --release --locked
      - name: Build tarball
        env:
          ARCH: ${{ matrix.arch }}
          VER: ${{ needs.version.outputs.ver }}
        run: |
          ver=$VER
          mkdir dist
          dir=obsbot4linux-$ver-$ARCH-linux
          mkdir -p "$dir/systemd"
          cp target/release/obsbot4linux README.md CHANGELOG.md LICENSE "$dir"
          cp packaging/systemd/* "$dir/systemd"
          tar -czf "dist/$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-tarball-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      # deb and rpm package exactly this binary.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.arch }}
          path: target/release/obsbot4linux
          if-no-files-found: error

  deb:
    needs: [version, binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            deb: amd64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            deb: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - run: cargo install --locked cargo-deb@3.8.0
      - run: sudo apt-get install -y --no-install-recommends dpkg-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ matrix.arch }}
          path: target/release
      - name: Build deb
        env:
          DEB: ${{ matrix.deb }}
          VER: ${{ needs.version.outputs.ver }}
        run: |
          ver=$VER
          mkdir dist
          # no rebuild: package the binary from the binary job (artifacts drop the mode)
          chmod +x target/release/obsbot4linux
          cargo deb --no-build --deb-revision "" -o "dist/obsbot4linux_${ver}_$DEB.deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-deb-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  rpm:
    needs: [version, binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - run: cargo install --locked cargo-generate-rpm@0.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ matrix.arch }}
          path: target/release
      - name: Build rpm
        env:
          ARCH: ${{ matrix.arch }}
          VER: ${{ needs.version.outputs.ver }}
        run: |
          ver=$VER
          mkdir dist
          chmod +x target/release/obsbot4linux
          cargo generate-rpm -o "dist/obsbot4linux-$ver-1.$ARCH.rpm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-rpm-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Builds from the source tarball in an Arch container; independent of `binary`.
  arch:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            # Arch Linux, daily image, pinned by digest
            arch_image: archlinux/archlinux@sha256:846dcf08b36edc8e4247e6abd622936f20dd620aae1f7fdfdc146a6b4e86e628
          - runner: ubuntu-22.04-arm
            arch: aarch64
            # Arch Linux ARM (menci/archlinuxarm, daily multi-arch), pinned by digest
            arch_image: menci/archlinuxarm@sha256:0a4663459ee538d31c7f2fc496f32dfc3f87d1c134141ecded15f2e1d04b00ce
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Arch package
        env:
          ARCH_IMAGE: ${{ matrix.arch_image }}
          VER: ${{ needs.version.outputs.ver }}
        run: scripts/build-arch.sh "$ARCH_IMAGE" "$VER" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-arch-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Tags only: a pull request builds the packages above and publishes nothing.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [binary, deb, rpm, arch]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      # build provenance attestation: OIDC token and the attestations API
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - run: cd dist && sha256sum obsbot4linux* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/changelog-section.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md dist/*

  # The project page with the new version (pages.yml, also run by hand). Needs GitHub Pages
  # switched on (source: GitHub Actions) and the github-pages environment allowing v* tags.
  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
