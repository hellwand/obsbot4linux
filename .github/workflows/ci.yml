name: CI

# Pull requests only, no paths filter: the required check must come from a pull request run
# (a push run would attach it to a commit that never was a pull request head), and it must
# always report.
on:
  pull_request:
    branches: [main, rebuild]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Every job's toolchain, also in release.yml: bump both deliberately, a new clippy can bring
  # new lints.
  RUSTUP_TOOLCHAIN: "1.99.1"

jobs:
  # Docs-only changes (Markdown, LICENSE, docs/) skip fmt, clippy and test.
  changes:
    runs-on: ubuntu-22.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          range="$PR_BASE...$PR_HEAD"
          # --no-renames lists a renamed file under its old path too. Anything unclear (a failed
          # or empty diff) counts as code.
          code=true
          if files=$(git diff --no-renames --name-only "$range") && [ -n "$files" ]; then
            code=false
            for f in $files; do
              case $f in
                *.md | LICENSE | docs/*) ;;
                *) code=true ;;
              esac
            done
          fi
          echo "changed files ($range):"
          echo "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --no-self-update
      - run: cargo fmt --check

  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --no-self-update
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - run: cargo test --locked

  # Builds and tests with the oldest Rust that Cargo.toml's rust-version claims.
  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          cargo "+$msrv" test --locked

  # The one check the main ruleset requires. Code changes need fmt, clippy, test and msrv to
  # succeed; docs-only changes need them skipped. Anything else fails.
  required:
    if: always()
    needs: [changes, fmt, clippy, test, msrv]
    runs-on: ubuntu-22.04
    env:
      CHANGES: ${{ needs.changes.result }}
      CODE: ${{ needs.changes.outputs.code }}
      JOBS: >-
        ${{ needs.fmt.result }} ${{ needs.clippy.result }} ${{ needs.test.result }}
        ${{ needs.msrv.result }}
    steps:
      - run: |
          echo "changes=$CHANGES code=$CODE fmt/clippy/test/msrv=$JOBS"
          test "$CHANGES" = success
          case $CODE in
            true) test "$JOBS" = "success success success success" ;;
            false) test "$JOBS" = "skipped skipped skipped skipped" ;;
            *) exit 1 ;;
          esac
