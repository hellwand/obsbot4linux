# GitHub Pages: the project page (site/) at https://hellwand.github.io/obsbot4linux/. Called by
# release.yml after the GitHub release was made, and run by hand (workflow_dispatch) for text or
# screenshot fixes between releases. Not run on push: the page never shows an unreleased version.
#
# The version on the page is not edited by hand: the build rewrites the one `VER=... # latest
# release, <date>` line of site/index.html from the latest release (tag and date), whatever ref the
# run is on. The value committed in site/ is only what a local preview shows.
name: pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build the page
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: copy site/ and stamp the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r tag published < <(gh release view -R "$GITHUB_REPOSITORY" \
            --json tagName,publishedAt --jq '"\(.tagName) \(.publishedAt)"')
          ver=${tag#v}
          date=${published%%T*}
          echo "latest release: $tag ($date)"
          [[ $ver =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ $date =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          mkdir -p dist
          cp -r site dist/pages
          page=dist/pages/index.html
          line='VER=[^ ]*   # latest release, [0-9-]*'
          test "$(grep -c "$line" "$page")" = 1
          sed -i "s|$line|VER=$ver   # latest release, $date|" "$page"
          grep -F "VER=$ver   # latest release, $date" "$page"
          touch dist/pages/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # One deployment at a time (a job-level group: this workflow is also called by release.yml).
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
